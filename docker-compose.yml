name: fruit-recognition

services:
  # 推理后端：FastAPI + YOLO/SAM + DeepSeek 调用
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fruit-api:1.0
    environment:
      # 权重用挂载，不进镜像；路径由 reasoning_yolo.py 读取
      YOLO_WEIGHTS: /app/models/best.pt
      SAM_WEIGHTS: /app/models/sam2.1_b.pt
      # SQLite 放到挂载目录，容器重建数据还在（注意是 4 个斜杠）
      DATABASE_URL: sqlite:////app/data/app.db
    volumes:
      - ./models/best.pt:/app/models/best.pt:ro
      - ./models/sam2.1_b.pt:/app/models/sam2.1_b.pt:ro
      - ./data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      # 首次启动要加载 torch + YOLO + SAM，给足时间
      start_period: 120s

  # Gradio 页面：不加载模型，只调 api
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: fruit-web:1.0
    environment:
      API_BASE: http://api:8000
      GRADIO_SERVER_NAME: 0.0.0.0
      GRADIO_SERVER_PORT: "7860"
      GRADIO_INBROWSER: "0"
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # 可选：nginx 反代，只开 80。
  # 启用命令：docker compose --profile proxy up -d --build
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped
