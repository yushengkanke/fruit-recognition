server {
    listen 80;
    server_name _;

    # 上传图片大小上限（nginx 默认 1m，大图会 413）
    client_max_body_size 20m;

    # Gradio 页面；它自带 WebSocket，必须带 Upgrade 头
    location / {
        proxy_pass http://web:7860;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # services.py 的接口没有 /api 前缀，这里按具体路径转发
    location ~ ^/(register|logins|changeapikey|run|docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 600s;
    }

    # 结果图片（Gradio 是服务端拉取，这里主要方便浏览器直接看）
    location /media/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
